    function MarketplaceMapsApp() {
      const [lang, setLang] = useState('zh');
      const t = translations[lang];

      const [markers, setMarkers] = useState(initialWorldOnsens);
      const [selectedMarker, setSelectedMarker] = useState(null);
      const [isEditing, setIsEditing] = useState(false);
      const [copySuccess, setCopySuccess] = useState(false);
      const [isMobileFilterOpen, setIsMobileFilterOpen] = useState(false);

      const [formState, setFormState] = useState({
        id: '',
        nameZh: '',
        nameEn: '',
        category: 'localFeature',
        visitedYear: 2024,
        rating: 4.8,
        price: 5000,
        mineral: 'sulfur',
        image: '',
        descZh: '',
        descEn: '',
        lat: 31.8,
        lng: 130.7
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedMineral, setSelectedMineral] = useState('ALL');
      const [priceMax, setPriceMax] = useState(16000);
      const [layerMode, setLayerMode] = useState('normal');

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerGroupRef = useRef(null);
      const heatCirclesLayerGroupRef = useRef(null);

      const categoryConfig = {
        wildSpring: {
          label: t.wildSpring,
          badgeColor: "bg-wellness-moss text-white",
          accentColor: "#3B4D3C",
        },
        localFeature: {
          label: t.localFeature,
          badgeColor: "bg-wellness-earth text-white",
          accentColor: "#8C684E",
        },
        historicRyokan: {
          label: t.historicRyokan,
          badgeColor: "bg-wellness-terracotta text-white",
          accentColor: "#BA6B50",
        },
        luxuryResort: {
          label: t.luxuryResort,
          badgeColor: "bg-wellness-forest text-wellness-sand",
          accentColor: "#263427",
        }
      };

      const getName = (m) => (typeof m.name === 'object' ? (m.name[lang] || m.name.zh || m.name.en) : m.name);
      const getDesc = (m) => (typeof m.description === 'object' ? (m.description[lang] || m.description.zh || m.description.en) : m.description);

      const filteredMarkers = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();
        return markers.filter((m) => {
          let matchSearch = true;
          if (query) {
            const nameStr = getName(m).toLowerCase();
            const descStr = getDesc(m).toLowerCase();
            const catLabel = (categoryConfig[m.category]?.label || '').toLowerCase();
            const mineralLabel = (t[m.mineral] || '').toLowerCase();
            const searchableText = `${nameStr} ${descStr} ${catLabel} ${mineralLabel} ${m.mineral}`.toLowerCase();

            const terms = query.split(/\s+/);
            const allTermsMatch = terms.every((term) => searchableText.includes(term));
            const strippedQuery = query.replace(/(溫泉|温泉|名湯|湯宿|泉|spring|springs|spa|resort)/gi, '').trim();
            const strippedMatch = strippedQuery.length > 0 && searchableText.includes(strippedQuery);

            matchSearch = allTermsMatch || strippedMatch || searchableText.includes(query);
          }

          const matchCat = selectedCategory === 'ALL' || m.category === selectedCategory;
          const matchMineral = selectedMineral === 'ALL' || m.mineral === selectedMineral;
          const matchPrice = m.price <= priceMax;
          return matchSearch && matchCat && matchMineral && matchPrice;
        });
      }, [markers, searchQuery, selectedCategory, selectedMineral, priceMax, lang]);

      // 切換療癒型態時，自動調整邊界包覆所有點位
      useEffect(() => {
        if (!mapInstanceRef.current || filteredMarkers.length === 0) return;

        if (filteredMarkers.length > 1) {
          const bounds = L.latLngBounds(filteredMarkers.map((m) => [m.lat, m.lng]));
          mapInstanceRef.current.fitBounds(bounds, {
            padding: [50, 50],
            maxZoom: 11,
            animate: true,
            duration: 1.2
          });
          setSelectedMarker(null);
        } else if (filteredMarkers.length === 1) {
          flyToLocation(filteredMarkers[0].lat, filteredMarkers[0].lng, 12);
          setSelectedMarker(filteredMarkers[0]);
        }
      }, [selectedCategory, selectedMineral]);

      // 搜尋時即時自動飛往目標
      useEffect(() => {
        const query = searchQuery.trim();
        if (!query || !mapInstanceRef.current) return;

        if (filteredMarkers.length > 0) {
          const firstMatch = filteredMarkers[0];
          flyToLocation(firstMatch.lat, firstMatch.lng, 13);
          setSelectedMarker(firstMatch);
          setIsEditing(false);
        }
      }, [searchQuery]);

      const handleSearchKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (filteredMarkers.length > 0) {
            const target = filteredMarkers[0];
            setSelectedMarker(target);
            flyToLocation(target.lat, target.lng, 13);
          }
        }
      };

      // 初始化 Leaflet 開源地圖 (以九州名湯群為中心)
      useEffect(() => {
        if (!mapInstanceRef.current && mapRef.current) {
          const map = L.map(mapRef.current, {
            center: [32.15, 130.85],
            zoom: 8,
            minZoom: 2,
            maxZoom: 18,
            zoomControl: false,
          });

          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);

          L.control.zoom({ position: 'bottomright' }).addTo(map);

          markersLayerGroupRef.current = L.layerGroup().addTo(map);
          heatCirclesLayerGroupRef.current = L.layerGroup().addTo(map);

          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            setFormState({
              id: `onsen-${Date.now()}`,
              nameZh: '',
              nameEn: '',
              category: 'localFeature',
              visitedYear: 2024,
              rating: 4.8,
              price: 5000,
              mineral: 'sulfur',
              image: 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80',
              descZh: '',
              descEn: '',
              lat: Number(lat.toFixed(4)),
              lng: Number(lng.toFixed(4))
            });
            setSelectedMarker(null);
            setIsEditing(true);
          });

          mapInstanceRef.current = map;
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // 渲染地熱光暈圈與地標
      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerGroupRef.current || !heatCirclesLayerGroupRef.current) return;

        markersLayerGroupRef.current.clearLayers();
        heatCirclesLayerGroupRef.current.clearLayers();

        if (layerMode === 'heatmap') {
          filteredMarkers.forEach((m) => {
            const circleRadius = (m.price * 2) + 20000;
            const circle = L.circle([m.lat, m.lng], {
              radius: circleRadius,
              fillColor: m.price > 8000 ? '#BA6B50' : '#8C684E',
              fillOpacity: 0.42,
              stroke: true,
              color: '#3B4D3C',
              weight: 1.5,
            });
            circle.bindTooltip(`<b>${getName(m)}</b><br/>${t.avgSpend}: NT$ ${m.price.toLocaleString()}`, { sticky: true });
            heatCirclesLayerGroupRef.current.addLayer(circle);
          });
        } else {
          filteredMarkers.forEach((m) => {
            const config = categoryConfig[m.category] || categoryConfig.localFeature;

            const customHtml = `
              <div class="group relative cursor-pointer flex flex-col items-center">
                <div class="w-8 h-8 md:w-9 md:h-9 rounded-full ${config.badgeColor} border-[2px] border-wellness-cream shadow-md flex items-center justify-center transform transition duration-300 group-hover:scale-125">
                  <span class="text-xs font-serif italic tracking-tighter">♨</span>
                  <div class="absolute -top-1.5 -right-1 bg-wellness-cream text-wellness-forest text-[9px] font-serif font-bold px-1 py-0.1 rounded-full border border-wellness-sandstone shadow-sm">
                    ${m.rating}
                  </div>
                </div>
                <div class="w-2 h-1 bg-wellness-forest/30 rounded-full blur-[1px] mt-0.5"></div>
              </div>
            `;

            const customIcon = L.divIcon({
              className: 'custom-wellness-marker',
              html: customHtml,
              iconSize: [32, 38],
              iconAnchor: [16, 34],
              popupAnchor: [0, -32]
            });

            const marker = L.marker([m.lat, m.lng], { icon: customIcon });

            const tooltipContent = `
              <div class="w-56 p-2.5 bg-wellness-cream text-wellness-charcoal">
                <img src="${m.image}" class="w-full h-24 object-cover rounded-xl mb-2 shadow-sm" />
                <div class="font-serif text-xs font-semibold tracking-wide text-wellness-forest">${getName(m)}</div>
                <div class="text-[10px] text-wellness-earth flex justify-between items-center mt-1 pt-1 border-t border-wellness-sandstone/60">
                  <span class="font-medium">${config.label}</span>
                  <span class="font-serif">${m.visitedYear} ${lang === 'zh' ? '年' : ''}</span>
                </div>
              </div>
            `;
            marker.bindTooltip(tooltipContent, {
              direction: 'top',
              opacity: 0.98,
              offset: [0, -25]
            });

            marker.on('click', () => {
              setSelectedMarker(m);
              setIsEditing(false);
            });

            markersLayerGroupRef.current.addLayer(marker);
          });
        }
      }, [filteredMarkers, layerMode, lang]);

      const switchToGlobalView = (mode) => {
        setLayerMode(mode);
        setSelectedMarker(null);
        if (mapInstanceRef.current) {
          // 平滑拉遠至宏觀視野
          mapInstanceRef.current.flyTo([32.15, 130.85], 7, {
            duration: 1.4
          });
        }
      };

      const flyToLocation = (lat, lng, zoomLevel) => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([lat, lng], zoomLevel, { duration: 1.4 });
        }
      };

      const handleSaveMarker = (e) => {
        e.preventDefault();
        const finalNameZh = formState.nameZh.trim() || formState.nameEn.trim();
        const finalNameEn = formState.nameEn.trim() || formState.nameZh.trim();
        if (!finalNameZh && !finalNameEn) return;

        const newMarkerData = {
          id: formState.id,
          name: { zh: finalNameZh, en: finalNameEn },
          category: formState.category,
          lat: Number(formState.lat),
          lng: Number(formState.lng),
          visitedYear: Number(formState.visitedYear),
          rating: Number(formState.rating),
          price: Number(formState.price),
          mineral: formState.mineral,
          image: formState.image || 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80',
          description: {
            zh: formState.descZh.trim() || formState.descEn.trim(),
            en: formState.descEn.trim() || formState.descZh.trim()
          }
        };

        setMarkers((prev) => {
          const exists = prev.some((m) => m.id === newMarkerData.id);
          if (exists) {
            return prev.map((m) => (m.id === newMarkerData.id ? newMarkerData : m));
          }
          return [...prev, newMarkerData];
        });

        setIsEditing(false);
        setSelectedMarker(newMarkerData);
        flyToLocation(newMarkerData.lat, newMarkerData.lng, 12);
      };

      const handleDeleteMarker = (id) => {
        setMarkers((prev) => prev.filter((m) => m.id !== id));
        setSelectedMarker(null);
        setIsEditing(false);
      };

      const handleExportJson = () => {
        const dataStr = JSON.stringify(markers, null, 2);
        navigator.clipboard.writeText(dataStr);
        setCopySuccess(true);
        setTimeout(() => setCopySuccess(false), 2500);
      };

      return (
        <div className="w-full h-full flex flex-col bg-wellness-cream text-wellness-charcoal font-sans overflow-hidden">
          {/* 1. 彈性響應式導航列（支援手機自動換行，不切斷邊界） */}
          <header className="border-b border-wellness-sandstone bg-wellness-cream/95 backdrop-blur-md px-3 md:px-8 py-2 md:py-0 min-h-[3.75rem] md:h-20 flex flex-wrap items-center justify-between gap-2 relative z-[2000] w-full shrink-0">
            {/* 品牌標誌與移動端控制鍵 */}
            <div className="flex items-center justify-between w-full md:w-auto">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 md:w-11 md:h-11 rounded-full bg-wellness-forest text-wellness-sand flex items-center justify-center shadow-sm shrink-0">
                  <Icons.Leaf className="w-4 h-4 md:w-5 md:h-5" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-serif text-base md:text-xl font-bold tracking-wider text-wellness-forest uppercase">
                      {t.brand}
                    </h1>
                    <span className="hidden sm:inline-block text-[9px] tracking-widest px-2 py-0.5 rounded-full bg-wellness-sand text-wellness-moss border border-wellness-sandstone font-medium">
                      {t.badge}
                    </span>
                  </div>
                  <p className="text-[10px] md:text-xs text-wellness-earth font-light truncate max-w-[190px] sm:max-w-xs md:max-w-none">
                    {t.subtagline}
                  </p>
                </div>
              </div>

              {/* 手機快捷操作（篩選與語言） */}
              <div className="flex items-center gap-1.5 lg:hidden">
                <button
                  onClick={() => setIsMobileFilterOpen(true)}
                  className="px-2.5 py-1 rounded-full border border-wellness-sandstone bg-white text-wellness-forest shadow-xs flex items-center gap-1 text-[11px]"
                >
                  <Icons.Sliders className="w-3.5 h-3.5 text-wellness-earth" />
                  <span className="font-serif font-semibold">{filteredMarkers.length}</span>
                </button>
                <button
                  onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                  className="px-2 py-1 rounded-full border border-wellness-sandstone bg-white text-wellness-forest text-[11px] font-semibold"
                >
                  {lang === 'zh' ? 'EN' : '中'}
                </button>
              </div>
            </div>

            {/* 搜尋欄位與功能群組 */}
            <div className="flex items-center justify-between md:justify-end gap-2 w-full md:w-auto">
              {/* 搜尋欄 */}
              <div className="relative flex-1 md:w-64 lg:w-72">
                <Icons.Search className="w-3.5 h-3.5 text-wellness-earth/60 absolute left-3 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  onKeyDown={handleSearchKeyDown}
                  placeholder={t.searchPlaceholder}
                  className="w-full pl-8 pr-7 py-1.5 text-[11px] md:text-xs bg-wellness-sand/60 border border-wellness-sandstone rounded-full focus:outline-none focus:ring-1 focus:ring-wellness-terracotta focus:bg-white transition placeholder-wellness-charcoal/40"
                />
                {searchQuery.trim() && (
                  <div className="absolute left-0 right-0 top-full mt-1.5 bg-wellness-cream border border-wellness-sandstone rounded-2xl shadow-2xl overflow-hidden z-[3000] max-h-72 overflow-y-auto w-full">
                    {filteredMarkers.length > 0 ? (
                      filteredMarkers.map((item) => (
                        <div
                          key={item.id}
                          onClick={() => {
                            setSelectedMarker(item);
                            flyToLocation(item.lat, item.lng, 12);
                          }}
                          className="px-3 py-2 hover:bg-wellness-sand/80 cursor-pointer border-b border-wellness-sandstone/40 last:border-0 flex items-center justify-between transition"
                        >
                          <div className="truncate pr-2">
                            <div className="font-serif text-xs font-semibold text-wellness-forest truncate">{getName(item)}</div>
                            <div className="text-[10px] text-wellness-earth truncate">{categoryConfig[item.category]?.label} · {item.visitedYear}{lang === 'zh' ? '年' : ''}</div>
                          </div>
                          <span className="text-[10px] font-serif text-wellness-terracotta font-semibold shrink-0">NT$ {item.price.toLocaleString()}</span>
                        </div>
                      ))
                    ) : (
                      <div className="p-2.5 text-[11px] text-wellness-earth/70 text-center font-serif italic">
                        {lang === 'zh' ? '無相符的溫泉聖所' : 'No matching sanctuaries found'}
                      </div>
                    )}
                  </div>
                )}
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute right-2.5 top-1/2 -translate-y-1/2 text-wellness-earth hover:text-wellness-charcoal"
                  >
                    <Icons.X className="w-3 h-3" />
                  </button>
                )}
              </div>

              {/* 圖層模式切換 */}
              <div className="flex items-center bg-wellness-sand p-0.5 md:p-1 rounded-full border border-wellness-sandstone shrink-0">
                <button
                  onClick={() => switchToGlobalView('normal')}
                  className={`flex items-center gap-1 px-2.5 py-1 text-[10px] md:text-xs rounded-full font-medium transition ${
                    layerMode === 'normal'
                      ? 'bg-wellness-forest text-wellness-cream shadow-sm'
                      : 'text-wellness-charcoal/70 hover:text-wellness-charcoal'
                  }`}
                >
                  <Icons.Compass className="w-3 h-3" />
                  <span>{t.normalLayer}</span>
                </button>
                <button
                  onClick={() => switchToGlobalView('heatmap')}
                  className={`flex items-center gap-1 px-2.5 py-1 text-[10px] md:text-xs rounded-full font-medium transition ${
                    layerMode === 'heatmap'
                      ? 'bg-wellness-terracotta text-white shadow-sm'
                      : 'text-wellness-charcoal/70 hover:text-wellness-charcoal'
                  }`}
                >
                  <Icons.Activity className="w-3 h-3" />
                  <span>{t.heatmapLayer}</span>
                </button>
              </div>

              {/* 匯出與桌面語言鍵 */}
              <button
                onClick={handleExportJson}
                className="hidden lg:flex items-center gap-1 text-xs font-medium px-3.5 py-1.5 bg-white hover:bg-wellness-sand text-wellness-forest rounded-full border border-wellness-sandstone shadow-sm shrink-0"
              >
                {copySuccess ? <Icons.Check className="w-3 h-3 text-wellness-moss" /> : <Icons.Download className="w-3 h-3" />}
                {copySuccess ? t.copied : t.exportJson}
              </button>

              <button
                onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                className="hidden lg:flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-full border border-wellness-sandstone bg-white text-wellness-forest hover:bg-wellness-sand shrink-0"
              >
                <Icons.Globe className="w-3 h-3" />
                {lang === 'zh' ? 'English' : '繁體中文'}
              </button>
            </div>
          </header>

          {/* 2. 焦點目的地捷徑列（可橫向滑動） */}
          <div className="bg-wellness-sand/40 border-b border-wellness-sandstone px-3 md:px-8 py-1.5 flex items-center gap-2 overflow-x-auto text-xs z-10 shrink-0">
            <span className="text-wellness-forest font-serif italic text-xs tracking-wide flex items-center gap-1 shrink-0">
              <Icons.Sparkles className="w-3 h-3 text-wellness-terracotta" />
              {t.quickJump}
            </span>
            {sanctuaries.map((d) => (
              <button
                key={d.name[lang]}
                onClick={() => flyToLocation(d.lat, d.lng, d.zoom)}
                className="px-2.5 py-0.5 bg-white/80 hover:bg-wellness-moss hover:text-white border border-wellness-sandstone/80 rounded-full shrink-0 transition text-wellness-charcoal/80 text-[11px]"
              >
                {d.name[lang]}
              </button>
            ))}
          </div>

          {/* 3. 主地圖與側欄容器 */}
          <div className="flex-1 flex overflow-hidden relative w-full h-full">
            {/* 桌面側邊欄 */}
            <aside className="hidden lg:flex w-72 xl:w-80 border-r border-wellness-sandstone bg-wellness-cream/95 flex-col z-10 shadow-sm shrink-0">
              <div className="p-4 border-b border-wellness-sandstone/60 flex items-center justify-between">
                <span className="font-serif text-xs uppercase tracking-wider text-wellness-forest flex items-center gap-1.5 font-semibold">
                  <Icons.Sliders className="w-3.5 h-3.5 text-wellness-earth" />
                  {lang === 'zh' ? '指標篩選' : 'Filters'}
                </span>
                <span className="text-[11px] font-serif px-2 py-0.5 rounded-full bg-wellness-sand text-wellness-moss border border-wellness-sandstone">
                  {filteredMarkers.length} / {markers.length}
                </span>
              </div>

              <div className="p-4 space-y-5 overflow-y-auto flex-1">
                <div>
                  <label className="font-serif text-xs text-wellness-forest font-semibold block mb-2">
                    {t.typeLabel}
                  </label>
                  <div className="space-y-1">
                    {['ALL', 'wildSpring', 'localFeature', 'historicRyokan', 'luxuryResort'].map((key) => {
                      const isActive = selectedCategory === key;
                      const label = key === 'ALL' ? t.allTypes : categoryConfig[key]?.label;
                      return (
                        <button
                          key={key}
                          onClick={() => setSelectedCategory(key)}
                          className={`w-full text-left px-3 py-2 rounded-xl text-xs transition flex items-center justify-between ${
                            isActive
                              ? 'bg-wellness-forest text-wellness-cream shadow-sm font-medium'
                              : 'bg-wellness-sand/50 hover:bg-wellness-sand text-wellness-charcoal/80'
                          }`}
                        >
                          <span className="truncate flex items-center gap-1.5">
                            {key !== 'ALL' && (
                              <span
                                className="w-2 h-2 rounded-full shrink-0"
                                style={{ backgroundColor: categoryConfig[key]?.accentColor }}
                              />
                            )}
                            {label}
                          </span>
                          <span className="text-[10px] opacity-70">
                            {key === 'ALL' ? markers.length : markers.filter((m) => m.category === key).length}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1.5">
                    <Icons.Droplets className="w-3 h-3 inline mr-1 text-wellness-moss" />
                    {t.mineralLabel}
                  </label>
                  <select
                    value={selectedMineral}
                    onChange={(e) => setSelectedMineral(e.target.value)}
                    className="w-full text-xs p-2 rounded-xl bg-wellness-sand/60 border border-wellness-sandstone text-wellness-charcoal"
                  >
                    <option value="ALL">{t.allMinerals}</option>
                    <option value="carbonated">{t.carbonated}</option>
                    <option value="sulfur">{t.sulfur}</option>
                    <option value="chloride">{t.chloride}</option>
                    <option value="sulfate">{t.sulfate}</option>
                  </select>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="font-serif text-xs text-wellness-forest font-semibold">
                      {t.priceRange}
                    </label>
                    <span className="text-xs font-serif font-bold text-wellness-terracotta">
                      ≤ NT$ {priceMax.toLocaleString()}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="16000"
                    step="500"
                    value={priceMax}
                    onChange={(e) => setPriceMax(Number(e.target.value))}
                    className="w-full accent-wellness-moss h-1 bg-wellness-sandstone rounded-lg cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] font-serif text-wellness-earth mt-1">
                    <span>免費 (NT$ 0)</span>
                    <span>NT$ 8,000</span>
                    <span>NT$ 15,000+</span>
                  </div>
                </div>

                <div className="p-3 bg-wellness-sand/70 border border-wellness-sandstone rounded-2xl text-[11px] text-wellness-charcoal/80 flex items-start gap-2">
                  <Icons.Leaf className="w-3.5 h-3.5 shrink-0 text-wellness-moss mt-0.5" />
                  <p className="font-light leading-snug">{t.clickToAddTip}</p>
                </div>
              </div>
            </aside>

            {/* 手機版滑動抽屜 */}
            {isMobileFilterOpen && (
              <div className="fixed inset-0 bg-black/40 backdrop-blur-xs z-[2600] flex flex-col justify-end lg:hidden">
                <div className="fixed inset-0" onClick={() => setIsMobileFilterOpen(false)} />
                <div className="relative bg-wellness-cream rounded-t-3xl max-h-[80vh] flex flex-col shadow-2xl border-t border-wellness-sandstone overflow-hidden z-10">
                  <div className="p-3.5 border-b border-wellness-sandstone/60 flex items-center justify-between">
                    <span className="font-serif text-xs uppercase font-semibold text-wellness-forest flex items-center gap-1.5">
                      <Icons.Sliders className="w-3.5 h-3.5 text-wellness-earth" />
                      {lang === 'zh' ? '指標篩選' : 'Filters'}
                    </span>
                    <button onClick={() => setIsMobileFilterOpen(false)} className="p-1 text-wellness-earth">
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="p-4 space-y-4 overflow-y-auto flex-1 text-xs">
                    <div>
                      <label className="font-serif font-semibold block mb-1.5">{t.typeLabel}</label>
                      <div className="grid grid-cols-2 gap-1.5">
                        {['ALL', 'wildSpring', 'localFeature', 'historicRyokan', 'luxuryResort'].map((key) => {
                          const isActive = selectedCategory === key;
                          const label = key === 'ALL' ? t.allTypes : categoryConfig[key]?.label;
                          return (
                            <button
                              key={key}
                              onClick={() => setSelectedCategory(key)}
                              className={`px-2.5 py-1.5 rounded-lg text-left truncate ${
                                isActive ? 'bg-wellness-forest text-white' : 'bg-wellness-sand/60 text-wellness-charcoal'
                              }`}
                            >
                              {label}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div>
                      <label className="font-serif font-semibold block mb-1">{t.mineralLabel}</label>
                      <select
                        value={selectedMineral}
                        onChange={(e) => setSelectedMineral(e.target.value)}
                        className="w-full p-2 rounded-lg bg-wellness-sand/60 border border-wellness-sandstone"
                      >
                        <option value="ALL">{t.allMinerals}</option>
                        <option value="carbonated">{t.carbonated}</option>
                        <option value="sulfur">{t.sulfur}</option>
                        <option value="chloride">{t.chloride}</option>
                        <option value="sulfate">{t.sulfate}</option>
                      </select>
                    </div>

                    <div>
                      <div className="flex justify-between mb-1">
                        <span className="font-serif font-semibold">{t.priceRange}</span>
                        <span className="font-bold text-wellness-terracotta">≤ NT$ {priceMax.toLocaleString()}</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="16000"
                        step="500"
                        value={priceMax}
                        onChange={(e) => setPriceMax(Number(e.target.value))}
                        className="w-full accent-wellness-moss"
                      />
                    </div>

                    <button
                      onClick={() => setIsMobileFilterOpen(false)}
                      className="w-full py-2.5 rounded-full bg-wellness-forest text-white font-serif text-xs font-semibold"
                    >
                      {lang === 'zh' ? '套用並查看結果' : 'Apply Filters'} ({filteredMarkers.length})
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 4. 地圖主區域 */}
            <main className="flex-1 h-full relative overflow-hidden w-full">
              <div ref={mapRef} className="w-full h-full" />

              {/* 5. 詳情卡（手機全寬底部抽屜，桌機浮動面板） */}
              {selectedMarker && !isEditing && (
                <div className="fixed inset-x-0 bottom-0 max-h-[82vh] lg:max-h-none lg:h-auto lg:absolute lg:inset-x-auto lg:right-6 lg:top-6 lg:bottom-6 w-full lg:w-96 bg-wellness-cream/95 backdrop-blur-md border-t lg:border border-wellness-sandstone rounded-t-3xl lg:rounded-3xl shadow-2xl p-4 md:p-6 flex flex-col z-[2500] lg:z-[1000] overflow-y-auto">
                  <div className="flex justify-between items-start mb-3">
                    <span className={`text-[11px] px-2.5 py-0.5 rounded-full font-serif ${categoryConfig[selectedMarker.category]?.badgeColor}`}>
                      {categoryConfig[selectedMarker.category]?.label}
                    </span>
                    <button onClick={() => setSelectedMarker(null)} className="p-1 text-wellness-earth">
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="relative rounded-xl overflow-hidden mb-3 shadow-xs">
                    <img src={selectedMarker.image} alt={getName(selectedMarker)} className="w-full h-36 md:h-44 object-cover" />
                    <div className="absolute top-2 right-2 bg-wellness-cream/90 px-2 py-0.5 rounded-full text-[11px] font-serif font-bold text-wellness-forest shadow-xs">
                      ★ {selectedMarker.rating}
                    </div>
                  </div>

                  <h3 className="font-serif text-lg font-bold text-wellness-forest leading-snug mb-2">
                    {getName(selectedMarker)}
                  </h3>

                  <p className="text-xs text-wellness-charcoal/70 leading-relaxed font-light mb-4 border-l-2 border-wellness-sandstone pl-2.5 italic">
                    "{getDesc(selectedMarker)}"
                  </p>

                  {selectedMarker.driveFolder && (
                    <a
                      href={selectedMarker.driveFolder}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mb-3.5 px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100/80 border border-amber-200/70 text-amber-800 text-xs flex items-center justify-between transition group shadow-2xs"
                    >
                      <span className="flex items-center gap-2 font-medium">
                        <span className="text-base">📸</span>
                        <span>{lang === 'zh' ? '查看我的雲端相簿相片 (Google Drive)' : 'View Google Drive Photo Album'}</span>
                      </span>
                      <span className="text-[11px] text-amber-600 group-hover:translate-x-0.5 transition">↗</span>
                    </a>
                  )}

                  <div className="grid grid-cols-2 gap-2 mb-4 font-sans text-xs">
                    <div className="p-2.5 bg-white rounded-xl border border-wellness-sandstone">
                      <span className="text-[10px] text-wellness-earth block">{t.visited}</span>
                      <span className="font-serif font-semibold">{selectedMarker.visitedYear} {lang === 'zh' ? '年' : ''}</span>
                    </div>
                    <div className="p-2.5 bg-white rounded-xl border border-wellness-sandstone">
                      <span className="text-[10px] text-wellness-earth block">{t.avgSpend}</span>
                      <span className="font-serif font-semibold text-wellness-terracotta">NT$ {selectedMarker.price.toLocaleString()}</span>
                    </div>
                    <div className="p-2.5 bg-white rounded-xl border border-wellness-sandstone col-span-2">
                      <span className="text-[10px] text-wellness-earth block">{t.ingredients}</span>
                      <span className="font-medium text-wellness-moss">{t[selectedMarker.mineral] || selectedMarker.mineral}</span>
                    </div>
                  </div>

                  <div className="mt-auto pt-3 border-t border-wellness-sandstone flex gap-2">
                    <button
                      onClick={() => {
                        setFormState({
                          id: selectedMarker.id,
                          nameZh: typeof selectedMarker.name === 'object' ? (selectedMarker.name.zh || '') : selectedMarker.name,
                          nameEn: typeof selectedMarker.name === 'object' ? (selectedMarker.name.en || '') : '',
                          category: selectedMarker.category,
                          visitedYear: selectedMarker.visitedYear,
                          rating: selectedMarker.rating,
                          price: selectedMarker.price,
                          mineral: selectedMarker.mineral,
                          image: selectedMarker.image,
                          descZh: typeof selectedMarker.description === 'object' ? (selectedMarker.description.zh || '') : selectedMarker.description,
                          descEn: typeof selectedMarker.description === 'object' ? (selectedMarker.description.en || '') : '',
                          lat: selectedMarker.lat,
                          lng: selectedMarker.lng
                        });
                        setIsEditing(true);
                      }}
                      className="flex-1 py-2 rounded-full text-xs font-medium bg-wellness-sand text-wellness-forest flex items-center justify-center gap-1"
                    >
                      <Icons.Edit className="w-3.5 h-3.5" />
                      {t.editBtn}
                    </button>
                    <button
                      onClick={() => handleDeleteMarker(selectedMarker.id)}
                      className="px-4 py-2 rounded-full text-xs font-medium bg-rose-50 text-rose-700 flex items-center justify-center gap-1"
                    >
                      <Icons.Trash className="w-3.5 h-3.5" />
                      {t.deleteBtn}
                    </button>
                  </div>
                </div>
              )}

              {/* 6. 編輯 / 新增 表單 */}
              {isEditing && (
                <div className="fixed inset-x-0 bottom-0 max-h-[85vh] lg:max-h-none lg:h-auto lg:absolute lg:inset-x-auto lg:right-6 lg:top-6 lg:bottom-6 w-full lg:w-96 bg-wellness-cream border-t lg:border border-wellness-sandstone rounded-t-3xl lg:rounded-3xl shadow-2xl p-4 md:p-6 flex flex-col z-[2500] lg:z-[1000] overflow-y-auto">
                  <div className="flex justify-between items-center mb-4 pb-2 border-b border-wellness-sandstone">
                    <h3 className="font-serif text-base font-bold text-wellness-forest">
                      {formState.id.startsWith('onsen-') && (formState.nameZh || formState.nameEn) ? t.editMarkerTitle : t.newMarkerTitle}
                    </h3>
                    <button onClick={() => setIsEditing(false)} className="p-1 text-wellness-earth">
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveMarker} className="space-y-3 text-xs flex-1 flex flex-col">
                    <div>
                      <label className="font-serif font-semibold block mb-1">{lang === 'zh' ? '名稱' : 'Name'}</label>
                      <input
                        type="text"
                        required
                        value={lang === 'zh' ? formState.nameZh : formState.nameEn}
                        onChange={(e) => {
                          if (lang === 'zh') setFormState({ ...formState, nameZh: e.target.value });
                          else setFormState({ ...formState, nameEn: e.target.value });
                        }}
                        className="w-full p-2 rounded-lg bg-white border border-wellness-sandstone"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="font-serif font-semibold block mb-1">{t.typeLabel}</label>
                        <select
                          value={formState.category}
                          onChange={(e) => setFormState({ ...formState, category: e.target.value })}
                          className="w-full p-2 rounded-lg bg-white border border-wellness-sandstone"
                        >
                          <option value="wildSpring">{t.wildSpring}</option>
                          <option value="localFeature">{t.localFeature}</option>
                          <option value="historicRyokan">{t.historicRyokan}</option>
                          <option value="luxuryResort">{t.luxuryResort}</option>
                        </select>
                      </div>
                      <div>
                        <label className="font-serif font-semibold block mb-1">{t.mineralLabel}</label>
                        <select
                          value={formState.mineral}
                          onChange={(e) => setFormState({ ...formState, mineral: e.target.value })}
                          className="w-full p-2 rounded-lg bg-white border border-wellness-sandstone"
                        >
                          <option value="carbonated">{t.carbonated}</option>
                          <option value="sulfur">{t.sulfur}</option>
                          <option value="chloride">{t.chloride}</option>
                          <option value="sulfate">{t.sulfate}</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="block mb-1">{t.visitedYearLabel}</label>
                        <input
                          type="number"
                          value={formState.visitedYear}
                          onChange={(e) => setFormState({ ...formState, visitedYear: Number(e.target.value) })}
                          className="w-full p-1.5 rounded-lg bg-white border border-wellness-sandstone"
                        />
                      </div>
                      <div>
                        <label className="block mb-1">{t.ratingLabel}</label>
                        <input
                          type="number"
                          step="0.1"
                          min="1"
                          max="5"
                          value={formState.rating}
                          onChange={(e) => setFormState({ ...formState, rating: Number(e.target.value) })}
                          className="w-full p-1.5 rounded-lg bg-white border border-wellness-sandstone"
                        />
                      </div>
                      <div>
                        <label className="block mb-1">NT$</label>
                        <input
                          type="number"
                          step="100"
                          value={formState.price}
                          onChange={(e) => setFormState({ ...formState, price: Number(e.target.value) })}
                          className="w-full p-1.5 rounded-lg bg-white border border-wellness-sandstone"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-wellness-sand/40 p-2 rounded-xl border border-wellness-sandstone text-[10px]">
                      <div>
                        <span>{t.latLabel}</span>
                        <input
                          type="number"
                          step="0.0001"
                          value={formState.lat}
                          onChange={(e) => setFormState({ ...formState, lat: Number(e.target.value) })}
                          className="w-full p-1 bg-white border border-wellness-sandstone rounded"
                        />
                      </div>
                      <div>
                        <span>{t.lngLabel}</span>
                        <input
                          type="number"
                          step="0.0001"
                          value={formState.lng}
                          onChange={(e) => setFormState({ ...formState, lng: Number(e.target.value) })}
                          className="w-full p-1 bg-white border border-wellness-sandstone rounded"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1">{t.imgUrlLabel}</label>
                      <input
                        type="url"
                        value={formState.image}
                        onChange={(e) => setFormState({ ...formState, image: e.target.value })}
                        className="w-full p-1.5 rounded-lg bg-white border border-wellness-sandstone"
                      />
                    </div>

                    <div className="flex-1">
                      <label className="block mb-1">{lang === 'zh' ? '筆記' : 'Notes'}</label>
                      <textarea
                        rows={2}
                        value={lang === 'zh' ? formState.descZh : formState.descEn}
                        onChange={(e) => {
                          if (lang === 'zh') setFormState({ ...formState, descZh: e.target.value });
                          else setFormState({ ...formState, descEn: e.target.value });
                        }}
                        className="w-full p-2 rounded-lg bg-white border border-wellness-sandstone resize-none"
                      />
                    </div>

                    <div className="pt-2 border-t border-wellness-sandstone flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsEditing(false)}
                        className="flex-1 py-2 rounded-full bg-wellness-sand text-wellness-forest"
                      >
                        {t.cancelBtn}
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2 rounded-full bg-wellness-forest text-white font-serif"
                      >
                        {t.saveBtn}
                      </button>
                    </div>
                  </form>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<MarketplaceMapsApp />, document.getElementById('root'));
  </script>
</body>
</html>
