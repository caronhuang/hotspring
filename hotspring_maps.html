        wildSpring: {
          label: t.wildSpring,
          badgeColor: "bg-wellness-moss text-white",
          accentColor: "#3B4D3C",
        },
        localFeature: {
          label: t.localFeature,
          badgeColor: "bg-wellness-earth text-white",
          accentColor: "#8C684E",
        },
        historicRyokan: {
          label: t.historicRyokan,
          badgeColor: "bg-wellness-terracotta text-white",
          accentColor: "#BA6B50",
        },
        luxuryResort: {
          label: t.luxuryResort,
          badgeColor: "bg-wellness-forest text-wellness-sand",
          accentColor: "#263427",
        }
      };

      // 取得特定語言下的名稱與說明
      const getName = (m) => (typeof m.name === 'object' ? (m.name[lang] || m.name.zh || m.name.en) : m.name);
      const getDesc = (m) => (typeof m.description === 'object' ? (m.description[lang] || m.description.zh || m.description.en) : m.description);

      // 增強型模糊與分詞搜尋邏輯
      const filteredMarkers = useMemo(() => {
        const query = searchQuery.trim().toLowerCase();
        return markers.filter((m) => {
          let matchSearch = true;
          if (query) {
            const nameStr = getName(m).toLowerCase();
            const descStr = getDesc(m).toLowerCase();
            const catLabel = (categoryConfig[m.category]?.label || '').toLowerCase();
            const mineralLabel = (t[m.mineral] || '').toLowerCase();
            const searchableText = `${nameStr} ${descStr} ${catLabel} ${mineralLabel} ${m.mineral}`.toLowerCase();

            const terms = query.split(/\s+/);
            const allTermsMatch = terms.every((term) => searchableText.includes(term));
            const strippedQuery = query.replace(/(溫泉|温泉|名湯|湯宿|泉|spring|springs|spa|resort)/gi, '').trim();
            const strippedMatch = strippedQuery.length > 0 && searchableText.includes(strippedQuery);

            matchSearch = allTermsMatch || strippedMatch || searchableText.includes(query);
          }

          const matchCat = selectedCategory === 'ALL' || m.category === selectedCategory;
          const matchMineral = selectedMineral === 'ALL' || m.mineral === selectedMineral;
          const matchPrice = m.price <= priceMax;
          return matchSearch && matchCat && matchMineral && matchPrice;
        });
      }, [markers, searchQuery, selectedCategory, selectedMineral, priceMax, lang]);

      // 當使用者點擊切換「療癒型態」或篩選條件變更時，自動計算邊界 (fitBounds)，將該型態內所有溫泉地點完整囊括呈現！
      useEffect(() => {
        if (!mapInstanceRef.current || filteredMarkers.length === 0) return;

        // 如果該分類下有超過一個地點，自動調整縮放與中心以全數一目瞭然
        if (filteredMarkers.length > 1) {
          const bounds = L.latLngBounds(filteredMarkers.map((m) => [m.lat, m.lng]));
          mapInstanceRef.current.fitBounds(bounds, {
            padding: [60, 60],
            maxZoom: 9,
            animate: true,
            duration: 1.5
          });
          // 關閉詳情視窗以確保所有標注無死角可見
          setSelectedMarker(null);
        } else if (filteredMarkers.length === 1) {
          // 若僅有單一地點，直接飛往該處特寫
          flyToLocation(filteredMarkers[0].lat, filteredMarkers[0].lng, 11);
          setSelectedMarker(filteredMarkers[0]);
        }
      }, [selectedCategory, selectedMineral]);

      // 當輸入搜尋且產生匹配時，地圖直接平移飛往目標上方
      useEffect(() => {
        const query = searchQuery.trim();
        if (!query || !mapInstanceRef.current) return;

        if (filteredMarkers.length > 0) {
          const firstMatch = filteredMarkers[0];
          flyToLocation(firstMatch.lat, firstMatch.lng, 12);
          setSelectedMarker(firstMatch);
          setIsEditing(false);
        }
      }, [searchQuery]);

      const handleSearchKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (filteredMarkers.length > 0) {
            const target = filteredMarkers[0];
            setSelectedMarker(target);
            flyToLocation(target.lat, target.lng, 12);
          }
        }
      };

      // 初始化開源 OSM 地圖 (100% 免 API Key)
      useEffect(() => {
        if (!mapInstanceRef.current && mapRef.current) {
          const map = L.map(mapRef.current, {
            center: [28.0, 125.0],
            zoom: 4,
            minZoom: 2,
            maxZoom: 18,
            zoomControl: false,
          });

          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
          }).addTo(map);

          L.control.zoom({ position: 'bottomright' }).addTo(map);

          markersLayerGroupRef.current = L.layerGroup().addTo(map);
          heatCirclesLayerGroupRef.current = L.layerGroup().addTo(map);

          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            setFormState({
              id: `onsen-${Date.now()}`,
              nameZh: '',
              nameEn: '',
              category: 'localFeature',
              visitedYear: 2024,
              rating: 4.8,
              price: 180,
              mineral: 'sulfur',
              image: 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80',
              descZh: '',
              descEn: '',
              lat: Number(lat.toFixed(4)),
              lng: Number(lng.toFixed(4))
            });
            setSelectedMarker(null);
            setIsEditing(true);
          });

          mapInstanceRef.current = map;
        }

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, []);

      // 渲染標記與地熱能量圈
      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerGroupRef.current || !heatCirclesLayerGroupRef.current) return;

        markersLayerGroupRef.current.clearLayers();
        heatCirclesLayerGroupRef.current.clearLayers();

        if (layerMode === 'heatmap') {
          filteredMarkers.forEach((m) => {
            const circleRadius = (m.price * 750) + 60000;
            const circle = L.circle([m.lat, m.lng], {
              radius: circleRadius,
              fillColor: m.price > 250 ? '#BA6B50' : '#8C684E',
              fillOpacity: 0.38,
              stroke: true,
              color: '#3B4D3C',
              weight: 1,
            });
            circle.bindTooltip(`<b>${getName(m)}</b><br/>${t.avgSpend}: $${m.price} ${t.priceUnit}`, { sticky: true });
            heatCirclesLayerGroupRef.current.addLayer(circle);
          });
        } else {
          filteredMarkers.forEach((m) => {
            const config = categoryConfig[m.category] || categoryConfig.localFeature;

            const customHtml = `
              <div class="group relative cursor-pointer flex flex-col items-center">
                <div class="w-9 h-9 rounded-full ${config.badgeColor} border-[2px] border-wellness-cream shadow-md flex items-center justify-center transform transition duration-300 group-hover:scale-125 group-hover:-translate-y-1">
                  <span class="text-xs font-serif italic tracking-tighter">♨</span>
                  <div class="absolute -top-1.5 -right-1 bg-wellness-cream text-wellness-forest text-[10px] font-serif font-bold px-1.5 py-0.2 rounded-full border border-wellness-sandstone shadow-sm">
                    ${m.rating}
                  </div>
                </div>
                <div class="w-2 h-1 bg-wellness-forest/30 rounded-full blur-[1.5px] mt-1"></div>
              </div>
            `;

            const customIcon = L.divIcon({
              className: 'custom-wellness-marker',
              html: customHtml,
              iconSize: [36, 42],
              iconAnchor: [18, 38],
              popupAnchor: [0, -36]
            });

            const marker = L.marker([m.lat, m.lng], { icon: customIcon });

            const tooltipContent = `
              <div class="w-60 p-3 bg-wellness-cream text-wellness-charcoal">
                <img src="${m.image}" class="w-full h-28 object-cover rounded-xl mb-2.5 shadow-sm" />
                <div class="font-serif text-sm font-semibold tracking-wide text-wellness-forest">${getName(m)}</div>
                <div class="text-[11px] text-wellness-earth flex justify-between items-center mt-1.5 pt-1.5 border-t border-wellness-sandstone/60">
                  <span class="font-medium">${config.label}</span>
                  <span class="font-serif">${m.visitedYear} ${lang === 'zh' ? '年' : ''}</span>
                </div>
              </div>
            `;
            marker.bindTooltip(tooltipContent, {
              direction: 'top',
              opacity: 0.98,
              offset: [0, -28]
            });

            marker.on('click', () => {
              setSelectedMarker(m);
              setIsEditing(false);
            });

            markersLayerGroupRef.current.addLayer(marker);
          });
        }
      }, [filteredMarkers, layerMode, lang]);

      // 切換為全球宏觀視角 (看得到全世界所有地點標注)
      const switchToGlobalView = (mode) => {
        setLayerMode(mode);
        setSelectedMarker(null);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([25.0, 15.0], 2, {
            duration: 1.6
          });
        }
      };

      const flyToLocation = (lat, lng, zoomLevel) => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([lat, lng], zoomLevel, { duration: 1.8 });
        }
      };

      const handleSaveMarker = (e) => {
        e.preventDefault();
        const finalNameZh = formState.nameZh.trim() || formState.nameEn.trim();
        const finalNameEn = formState.nameEn.trim() || formState.nameZh.trim();
        if (!finalNameZh && !finalNameEn) return;

        const newMarkerData = {
          id: formState.id,
          name: { zh: finalNameZh, en: finalNameEn },
          category: formState.category,
          lat: Number(formState.lat),
          lng: Number(formState.lng),
          visitedYear: Number(formState.visitedYear),
          rating: Number(formState.rating),
          price: Number(formState.price),
          mineral: formState.mineral,
          image: formState.image || 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80',
          description: {
            zh: formState.descZh.trim() || formState.descEn.trim(),
            en: formState.descEn.trim() || formState.descZh.trim()
          }
        };

        setMarkers((prev) => {
          const exists = prev.some((m) => m.id === newMarkerData.id);
          if (exists) {
            return prev.map((m) => (m.id === newMarkerData.id ? newMarkerData : m));
          }
          return [...prev, newMarkerData];
        });

        setIsEditing(false);
        setSelectedMarker(newMarkerData);
        flyToLocation(newMarkerData.lat, newMarkerData.lng, 10);
      };

      const handleDeleteMarker = (id) => {
        setMarkers((prev) => prev.filter((m) => m.id !== id));
        setSelectedMarker(null);
        setIsEditing(false);
      };

      const handleExportJson = () => {
        const dataStr = JSON.stringify(markers, null, 2);
        navigator.clipboard.writeText(dataStr);
        setCopySuccess(true);
        setTimeout(() => setCopySuccess(false), 2500);
      };

      return (
        <div className="w-full h-screen flex flex-col bg-wellness-cream text-wellness-charcoal font-sans overflow-hidden">
          {/* 1. 頂部導航列 (純單語呈現) */}
          <header className="h-20 border-b border-wellness-sandstone bg-wellness-cream/90 backdrop-blur-md px-8 flex items-center justify-between relative z-[2000]">
            <div className="flex items-center gap-4">
              <div className="w-11 h-11 rounded-full bg-wellness-forest text-wellness-sand flex items-center justify-center shadow-sm border border-wellness-moss/30">
                <Icons.Leaf className="w-5 h-5" />
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="font-serif text-xl md:text-2xl font-bold tracking-wider text-wellness-forest uppercase">
                    {t.brand}
                  </h1>
                  <span className="text-[10px] tracking-widest px-2.5 py-0.5 rounded-full bg-wellness-sand text-wellness-moss border border-wellness-sandstone font-medium">
                    {t.badge}
                  </span>
                </div>
                <p className="text-xs text-wellness-earth tracking-wide mt-0.5 font-light">
                  {t.subtagline}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              {/* 搜尋欄位 */}
              <div className="relative w-64 md:w-72">
                <Icons.Search className="w-4 h-4 text-wellness-earth/60 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  onKeyDown={handleSearchKeyDown}
                  placeholder={t.searchPlaceholder}
                  className="w-full pl-9 pr-8 py-2 text-xs bg-wellness-sand/60 border border-wellness-sandstone rounded-full focus:outline-none focus:ring-1 focus:ring-wellness-terracotta focus:bg-white transition placeholder-wellness-charcoal/40"
                />
                {searchQuery.trim() && (
                  <div className="absolute left-0 right-0 top-full mt-2 bg-wellness-cream border border-wellness-sandstone rounded-2xl shadow-2xl overflow-hidden z-[3000] max-h-80 overflow-y-auto min-w-[300px]">
                    {filteredMarkers.length > 0 ? (
                      filteredMarkers.map((item) => (
                        <div
                          key={item.id}
                          onClick={() => {
                            setSelectedMarker(item);
                            flyToLocation(item.lat, item.lng, 12);
                          }}
                          className="px-3.5 py-2.5 hover:bg-wellness-sand/80 cursor-pointer border-b border-wellness-sandstone/40 last:border-0 flex items-center justify-between transition"
                        >
                          <div className="truncate pr-2">
                            <div className="font-serif text-xs font-semibold text-wellness-forest truncate">{getName(item)}</div>
                            <div className="text-[10px] text-wellness-earth truncate">{categoryConfig[item.category]?.label} · {item.visitedYear}{lang === 'zh' ? '年' : ''}</div>
                          </div>
                          <span className="text-[10px] font-serif text-wellness-terracotta font-semibold shrink-0">${item.price}</span>
                        </div>
                      ))
                    ) : (
                      <div className="p-3 text-[11px] text-wellness-earth/70 text-center font-serif italic">
                        {lang === 'zh' ? '無相符的溫泉聖所' : 'No matching sanctuaries found'}
                      </div>
                    )}
                  </div>
                )}
                {searchQuery && (
                  <button
                    onClick={() => setSearchQuery('')}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-wellness-earth hover:text-wellness-charcoal"
                  >
                    <Icons.X className="w-3.5 h-3.5" />
                  </button>
                )}
              </div>

              {/* 視圖切換 (點擊任一模式皆自動切回全球 Global View) */}
              <div className="flex items-center bg-wellness-sand p-1 rounded-full border border-wellness-sandstone">
                <button
                  onClick={() => switchToGlobalView('normal')}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 text-xs rounded-full font-medium transition ${
                    layerMode === 'normal'
                      ? 'bg-wellness-forest text-wellness-cream shadow-sm'
                      : 'text-wellness-charcoal/70 hover:text-wellness-charcoal'
                  }`}
                >
                  <Icons.Compass className="w-3.5 h-3.5" />
                  {t.normalLayer}
                </button>
                <button
                  onClick={() => switchToGlobalView('heatmap')}
                  className={`flex items-center gap-1.5 px-3.5 py-1.5 text-xs rounded-full font-medium transition ${
                    layerMode === 'heatmap'
                      ? 'bg-wellness-terracotta text-white shadow-sm'
                      : 'text-wellness-charcoal/70 hover:text-wellness-charcoal'
                  }`}
                >
                  <Icons.Activity className="w-3.5 h-3.5" />
                  {t.heatmapLayer}
                </button>
              </div>

              {/* 導出收藏 */}
              <button
                onClick={handleExportJson}
                className="flex items-center gap-1.5 text-xs font-medium px-4 py-2 bg-white hover:bg-wellness-sand text-wellness-forest rounded-full border border-wellness-sandstone shadow-sm transition"
              >
                {copySuccess ? <Icons.Check className="w-3.5 h-3.5 text-wellness-moss" /> : <Icons.Download className="w-3.5 h-3.5" />}
                {copySuccess ? t.copied : t.exportJson}
              </button>

              {/* 語言切換按鈕 */}
              <button
                onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                className="flex items-center gap-1 text-xs font-semibold px-3.5 py-2 rounded-full border border-wellness-sandstone bg-white text-wellness-forest hover:bg-wellness-sand transition"
              >
                <Icons.Globe className="w-3.5 h-3.5" />
                {lang === 'zh' ? 'English' : '繁體中文'}
              </button>
            </div>
          </header>

          {/* 2. 焦點目的地捷徑列 (移除瑞士，純單語) */}
          <div className="bg-wellness-sand/40 border-b border-wellness-sandstone px-8 py-2.5 flex items-center gap-2.5 overflow-x-auto text-xs z-10">
            <span className="text-wellness-forest font-serif italic text-sm tracking-wide flex items-center gap-1.5 shrink-0 pr-2">
              <Icons.Sparkles className="w-3.5 h-3.5 text-wellness-terracotta" />
              {t.quickJump}
            </span>
            {sanctuaries.map((d) => (
              <button
                key={d.name[lang]}
                onClick={() => flyToLocation(d.lat, d.lng, d.zoom)}
                className="px-3.5 py-1 bg-white/80 hover:bg-wellness-moss hover:text-white border border-wellness-sandstone/80 rounded-full shrink-0 transition text-wellness-charcoal/80 font-normal shadow-2xs"
              >
                {d.name[lang]}
              </button>
            ))}
          </div>

          <div className="flex-1 flex overflow-hidden relative">
            {/* 3. 左側古典沙龍抽屜 */}
            <aside className="w-84 border-r border-wellness-sandstone bg-wellness-cream/95 flex flex-col z-10 shadow-sm">
              <div className="p-5 border-b border-wellness-sandstone/60 flex items-center justify-between">
                <span className="font-serif text-sm tracking-wider uppercase text-wellness-forest flex items-center gap-2">
                  <Icons.Sliders className="w-4 h-4 text-wellness-earth" />
                  {lang === 'zh' ? '身心靈指標篩選' : 'Criteria & Filters'}
                </span>
                <span className="text-xs font-serif italic px-2.5 py-0.5 rounded-full bg-wellness-sand text-wellness-moss border border-wellness-sandstone">
                  {filteredMarkers.length} / {markers.length} {lang === 'zh' ? '處' : 'places'}
                </span>
              </div>

              <div className="p-5 space-y-6 overflow-y-auto flex-1">
                {/* 湯型分類 */}
                <div>
                  <label className="font-serif text-sm text-wellness-forest font-semibold block mb-2.5">
                    {t.typeLabel}
                  </label>
                  <div className="space-y-1.5">
                    {['ALL', 'wildSpring', 'localFeature', 'historicRyokan', 'luxuryResort'].map((key) => {
                      const isActive = selectedCategory === key;
                      const label = key === 'ALL' ? t.allTypes : categoryConfig[key]?.label;
                      return (
                        <button
                          key={key}
                          onClick={() => setSelectedCategory(key)}
                          className={`w-full text-left px-3.5 py-2.5 rounded-xl text-xs transition flex items-center justify-between ${
                            isActive
                              ? 'bg-wellness-forest text-wellness-cream shadow-sm font-medium'
                              : 'bg-wellness-sand/50 hover:bg-wellness-sand text-wellness-charcoal/80'
                          }`}
                        >
                          <span className="flex items-center gap-2 truncate">
                            {key !== 'ALL' && (
                              <span
                                className="w-2 h-2 rounded-full shrink-0"
                                style={{ backgroundColor: categoryConfig[key]?.accentColor }}
                              />
                            )}
                            {label}
                          </span>
                          <span className="text-[11px] font-serif opacity-70">
                            {key === 'ALL'
                              ? markers.length
                              : markers.filter((m) => m.category === key).length}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 泉質與芳療成分 */}
                <div>
                  <label className="font-serif text-sm text-wellness-forest font-semibold block mb-2">
                    <Icons.Droplets className="w-3.5 h-3.5 inline mr-1 text-wellness-moss" />
                    {t.mineralLabel}
                  </label>
                  <select
                    value={selectedMineral}
                    onChange={(e) => setSelectedMineral(e.target.value)}
                    className="w-full text-xs p-2.5 rounded-xl bg-wellness-sand/60 border border-wellness-sandstone text-wellness-charcoal focus:outline-none focus:ring-1 focus:ring-wellness-moss"
                  >
                    <option value="ALL">{t.allMinerals}</option>
                    <option value="sulfur">{t.sulfur}</option>
                    <option value="carbonated">{t.carbonated}</option>
                    <option value="chloride">{t.chloride}</option>
                    <option value="iron">{t.iron}</option>
                  </select>
                </div>

                {/* 客單價體驗預算 */}
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <label className="font-serif text-sm text-wellness-forest font-semibold">
                      {t.priceRange}
                    </label>
                    <span className="text-xs font-serif font-bold text-wellness-terracotta">
                      ≤ ${priceMax} {t.priceUnit}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="30"
                    max="600"
                    step="20"
                    value={priceMax}
                    onChange={(e) => setPriceMax(Number(e.target.value))}
                    className="w-full accent-wellness-moss h-1.5 bg-wellness-sandstone rounded-lg cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-serif text-wellness-earth mt-1.5">
                    <span>$30</span>
                    <span>$300</span>
                    <span>$600+</span>
                  </div>
                </div>

                {/* 提示指引 */}
                <div className="p-4 bg-wellness-sand/70 border border-wellness-sandstone rounded-2xl text-xs text-wellness-charcoal/80 flex items-start gap-3">
                  <Icons.Leaf className="w-4 h-4 shrink-0 text-wellness-moss mt-0.5" />
                  <p className="font-light leading-relaxed">{t.clickToAddTip}</p>
                </div>
              </div>
            </aside>

            {/* 4. 地圖容器主畫布 (OpenStreetMap) */}
            <main className="flex-1 h-full relative overflow-hidden">
              <div ref={mapRef} className="w-full h-full" />

              {/* 5. 點擊彈出的名湯詳情卡 */}
              {selectedMarker && !isEditing && (
                <div className="absolute right-8 top-8 bottom-8 w-[400px] bg-wellness-cream/95 backdrop-blur-md border border-wellness-sandstone rounded-3xl shadow-2xl p-7 flex flex-col z-[1000] overflow-y-auto">
                  <div className="flex justify-between items-start mb-4">
                    <span
                      className={`text-xs px-3 py-1 rounded-full font-serif tracking-wider ${
                        categoryConfig[selectedMarker.category]?.badgeColor
                      }`}
                    >
                      {categoryConfig[selectedMarker.category]?.label}
                    </span>
                    <button
                      onClick={() => setSelectedMarker(null)}
                      className="p-1.5 rounded-full hover:bg-wellness-sand text-wellness-earth hover:text-wellness-charcoal transition"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="relative rounded-2xl overflow-hidden mb-5 shadow-sm">
                    <img
                      src={selectedMarker.image}
                      alt={getName(selectedMarker)}
                      className="w-full h-48 object-cover transform hover:scale-105 transition duration-700"
                    />
                    <div className="absolute top-3 right-3 bg-wellness-cream/90 backdrop-blur px-2.5 py-1 rounded-full text-xs font-serif font-bold text-wellness-forest shadow-sm">
                      ★ {selectedMarker.rating}
                    </div>
                  </div>

                  <h3 className="font-serif text-xl font-bold text-wellness-forest leading-snug mb-3">
                    {getName(selectedMarker)}
                  </h3>

                  <p className="text-xs text-wellness-charcoal/70 leading-relaxed font-light mb-6 border-l-2 border-wellness-sandstone pl-3 italic">
                    "{getDesc(selectedMarker)}"
                  </p>

                  <div className="grid grid-cols-2 gap-3 mb-6 font-sans">
                    <div className="p-3 bg-white rounded-2xl border border-wellness-sandstone">
                      <span className="text-[10px] text-wellness-earth uppercase tracking-wider block mb-0.5">{t.visited}</span>
                      <span className="text-sm font-serif font-semibold text-wellness-forest">{selectedMarker.visitedYear} {lang === 'zh' ? '年' : ''}</span>
                    </div>
                    <div className="p-3 bg-white rounded-2xl border border-wellness-sandstone">
                      <span className="text-[10px] text-wellness-earth uppercase tracking-wider block mb-0.5">{t.avgSpend}</span>
                      <span className="text-sm font-serif font-semibold text-wellness-terracotta">${selectedMarker.price} {t.priceUnit}</span>
                    </div>
                    <div className="p-3 bg-white rounded-2xl border border-wellness-sandstone col-span-2">
                      <span className="text-[10px] text-wellness-earth uppercase tracking-wider block mb-0.5">{t.ingredients}</span>
                      <span className="text-xs font-medium text-wellness-moss">
                        {t[selectedMarker.mineral] || selectedMarker.mineral}
                      </span>
                    </div>
                    <div className="p-3 bg-white rounded-2xl border border-wellness-sandstone col-span-2">
                      <span className="text-[10px] text-wellness-earth uppercase tracking-wider block mb-0.5">{t.coordinates}</span>
                      <span className="text-xs font-mono text-wellness-charcoal/60">
                        {selectedMarker.lat}° N, {selectedMarker.lng}° E
                      </span>
                    </div>
                  </div>

                  <div className="mt-auto pt-4 border-t border-wellness-sandstone flex gap-2">
                    <button
                      onClick={() => {
                        setFormState({
                          id: selectedMarker.id,
                          nameZh: typeof selectedMarker.name === 'object' ? (selectedMarker.name.zh || '') : selectedMarker.name,
                          nameEn: typeof selectedMarker.name === 'object' ? (selectedMarker.name.en || '') : '',
                          category: selectedMarker.category,
                          visitedYear: selectedMarker.visitedYear,
                          rating: selectedMarker.rating,
                          price: selectedMarker.price,
                          mineral: selectedMarker.mineral,
                          image: selectedMarker.image,
                          descZh: typeof selectedMarker.description === 'object' ? (selectedMarker.description.zh || '') : selectedMarker.description,
                          descEn: typeof selectedMarker.description === 'object' ? (selectedMarker.description.en || '') : '',
                          lat: selectedMarker.lat,
                          lng: selectedMarker.lng
                        });
                        setIsEditing(true);
                      }}
                      className="flex-1 py-2.5 rounded-full text-xs font-medium bg-wellness-sand hover:bg-wellness-sandstone text-wellness-forest flex items-center justify-center gap-1.5 transition"
                    >
                      <Icons.Edit className="w-3.5 h-3.5" />
                      {t.editBtn}
                    </button>
                    <button
                      onClick={() => handleDeleteMarker(selectedMarker.id)}
                      className="px-5 py-2.5 rounded-full text-xs font-medium bg-rose-50 hover:bg-rose-100 text-rose-700 flex items-center justify-center gap-1.5 transition"
                    >
                      <Icons.Trash className="w-3.5 h-3.5" />
                      {t.deleteBtn}
                    </button>
                  </div>
                </div>
              )}

              {/* 6. 編輯 / 新增 表單 */}
              {isEditing && (
                <div className="absolute right-8 top-8 bottom-8 w-[400px] bg-wellness-cream border border-wellness-sandstone rounded-3xl shadow-2xl p-7 flex flex-col z-[1000] overflow-y-auto">
                  <div className="flex justify-between items-center mb-5 pb-3 border-b border-wellness-sandstone">
                    <h3 className="font-serif text-lg font-bold text-wellness-forest">
                      {formState.id.startsWith('onsen-') && (formState.nameZh || formState.nameEn) ? t.editMarkerTitle : t.newMarkerTitle}
                    </h3>
                    <button
                      onClick={() => setIsEditing(false)}
                      className="p-1 rounded-full hover:bg-wellness-sand text-wellness-earth"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>

                  <form onSubmit={handleSaveMarker} className="space-y-4 text-xs flex-1 flex flex-col font-sans">
                    <div>
                      <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">
                        {lang === 'zh' ? '溫泉名稱 (中文)' : 'Name (English)'}
                      </label>
                      <input
                        type="text"
                        required
                        value={lang === 'zh' ? formState.nameZh : formState.nameEn}
                        onChange={(e) => {
                          if (lang === 'zh') setFormState({ ...formState, nameZh: e.target.value });
                          else setFormState({ ...formState, nameEn: e.target.value });
                        }}
                        placeholder={lang === 'zh' ? '例：黑川秘湯・山吹之宿' : 'e.g. Yamabuki Kurokawa'}
                        className="w-full p-2.5 rounded-xl bg-white border border-wellness-sandstone text-wellness-charcoal focus:outline-none focus:ring-1 focus:ring-wellness-moss"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.typeLabel}</label>
                        <select
                          value={formState.category}
                          onChange={(e) => setFormState({ ...formState, category: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white border border-wellness-sandstone"
                        >
                          <option value="wildSpring">{t.wildSpring}</option>
                          <option value="localFeature">{t.localFeature}</option>
                          <option value="historicRyokan">{t.historicRyokan}</option>
                          <option value="luxuryResort">{t.luxuryResort}</option>
                        </select>
                      </div>

                      <div>
                        <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.mineralLabel}</label>
                        <select
                          value={formState.mineral}
                          onChange={(e) => setFormState({ ...formState, mineral: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white border border-wellness-sandstone"
                        >
                          <option value="sulfur">{t.sulfur}</option>
                          <option value="carbonated">{t.carbonated}</option>
                          <option value="chloride">{t.chloride}</option>
                          <option value="iron">{t.iron}</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.visitedYearLabel}</label>
                        <input
                          type="number"
                          value={formState.visitedYear}
                          onChange={(e) => setFormState({ ...formState, visitedYear: Number(e.target.value) })}
                          className="w-full p-2 rounded-xl bg-white border border-wellness-sandstone"
                        />
                      </div>
                      <div>
                        <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.ratingLabel}</label>
                        <input
                          type="number"
                          step="0.1"
                          min="1"
                          max="5"
                          value={formState.rating}
                          onChange={(e) => setFormState({ ...formState, rating: Number(e.target.value) })}
                          className="w-full p-2 rounded-xl bg-white border border-wellness-sandstone"
                        />
                      </div>
                      <div>
                        <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.priceLabel}</label>
                        <input
                          type="number"
                          value={formState.price}
                          onChange={(e) => setFormState({ ...formState, price: Number(e.target.value) })}
                          className="w-full p-2 rounded-xl bg-white border border-wellness-sandstone"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-wellness-sand/40 p-2.5 rounded-2xl border border-wellness-sandstone">
                      <div>
                        <label className="block text-[10px] text-wellness-earth font-mono">{t.latLabel} (°N)</label>
                        <input
                          type="number"
                          step="0.0001"
                          value={formState.lat}
                          onChange={(e) => setFormState({ ...formState, lat: Number(e.target.value) })}
                          className="w-full p-1.5 bg-white border border-wellness-sandstone rounded-lg text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] text-wellness-earth font-mono">{t.lngLabel} (°E)</label>
                        <input
                          type="number"
                          step="0.0001"
                          value={formState.lng}
                          onChange={(e) => setFormState({ ...formState, lng: Number(e.target.value) })}
                          className="w-full p-1.5 bg-white border border-wellness-sandstone rounded-lg text-xs"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">{t.imgUrlLabel}</label>
                      <input
                        type="url"
                        value={formState.image}
                        onChange={(e) => setFormState({ ...formState, image: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white border border-wellness-sandstone"
                      />
                    </div>

                    <div className="flex-1">
                      <label className="font-serif text-xs text-wellness-forest font-semibold block mb-1">
                        {lang === 'zh' ? '靜修感受筆記 (中文)' : 'Journal Notes (English)'}
                      </label>
                      <textarea
                        rows={3}
                        value={lang === 'zh' ? formState.descZh : formState.descEn}
                        onChange={(e) => {
                          if (lang === 'zh') setFormState({ ...formState, descZh: e.target.value });
                          else setFormState({ ...formState, descEn: e.target.value });
                        }}
                        className="w-full p-2.5 rounded-xl bg-white border border-wellness-sandstone h-20 resize-none font-light"
                      />
                    </div>

                    <div className="pt-3 border-t border-wellness-sandstone flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsEditing(false)}
                        className="flex-1 py-2.5 rounded-full text-xs font-medium bg-wellness-sand hover:bg-wellness-sandstone text-wellness-forest transition"
                      >
                        {t.cancelBtn}
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-2.5 rounded-full text-xs font-serif tracking-wider font-semibold bg-wellness-forest hover:bg-wellness-moss text-wellness-cream shadow-md transition"
                      >
                        {t.saveBtn}
                      </button>
                    </div>
                  </form>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.render(<MarketplaceMapsApp />, document.getElementById('root'));
  </script>
</body>
</html>
